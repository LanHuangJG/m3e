<!doctype html>
<html lang="en">
  <head>
    <title>Vue for M3E</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Vue for M3E" />
    <base href="./" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0"
      rel="stylesheet"
    />
    <link href="../main.css" rel="stylesheet" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@m3e/web@2.7.12/dist/all.min.js"></script>
    <script src="../main.js"></script>
  </head>
  <body>
    <m3e-theme strong-focus></m3e-theme>
    <div class="panes">
      <m3e-content-pane id="body">
        <m3e-heading variant="display" size="large" level="1">Vue</m3e-heading>
        <p>
          M3E 不需要专门的 Vue 绑定包。Vue 对 Web Components 提供一等支持,所有 M3E 组件都可以直接在 Vue 模板中使用,无需额外的包装器。
        </p>
        <p>
          更多信息请参阅
          <a target="_blank" href="https://vuejs.org/guide/extras/web-components.html">Vue 与 Web Components</a>。
        </p>
      </m3e-content-pane>
    </div>
  </body>
</html>
